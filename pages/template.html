<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMIS – User | DICT</title>
  <link rel="icon" href="../../assets/AMIS-LOGO_only.png" type="image/png" />
  <link rel="stylesheet" href="../../common/common.css" />
  <link rel="stylesheet" href="../../common/layout.css" />
  <link rel="stylesheet" href="user-management.css" />
  <!-- <link rel="stylesheet" href="PAGE_NAME.css" /> optional: only if this page has unique styles -->

  <!-- ① Set page identity -->
  <script>
    window.AMIS_PAGE = {
      id:    'user-management',     // dashboard | system | user-management |
                            // files-data | views | operation-module |
                            // sticker-tag | about
      title: 'User Management',   // page title used in header and nav
    };
  </script>

  <!-- ② Common utilities -->
  <script src="../../common/common.js"></script>

  <!-- ③ Shared layout -->
  <script src="../../common/layout.js"></script>
</head>
<body>

    <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Confirm Dialog -->
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <div class="confirm-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
      </div>
      <h3>Delete User</h3>
      <p id="confirm-msg">Are you sure you want to delete this user? This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="confirm-cancel">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal">
      <div class="modal__head">
        <h2 id="modal-title">Add New User</h2>
        <button class="modal__close" id="modal-close">&times;</button>
      </div>
      <div class="modal__body">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Last Name *</label>
            <input class="form-control" id="f-lastname" type="text" placeholder="Last name" />
          </div>
          <div class="form-group">
            <label class="form-label">First Name *</label>
            <input class="form-control" id="f-firstname" type="text" placeholder="First name" />
          </div>
          <div class="form-group">
            <label class="form-label">Middle Name</label>
            <input class="form-control" id="f-middlename" type="text" placeholder="Middle name" />
          </div>
          <div class="form-group">
            <label class="form-label">Employee # *</label>
            <input class="form-control" id="f-empno" type="text" placeholder="e.g. 1202306074" />
          </div>
          <div class="form-group full">
            <label class="form-label">Email Address *</label>
            <input class="form-control" id="f-email" type="email" placeholder="user@dict.gov.ph" />
          </div>
          <div class="form-group full">
            <label class="form-label">Role</label>
            <select class="form-control" id="f-role">
              <option value="">-- Select Role --</option>
              <option>Administrator</option>
              <option>Custodian</option>
              <option>Approver</option>
              <option>Viewer</option>
            </select>
          </div>
          <div class="form-group full">
            <div class="form-section-title">Permissions</div>
            <div class="form-check-row">
              <label class="form-check"><input type="checkbox" id="f-custodian" /> Custodian Type</label>
              <label class="form-check"><input type="checkbox" id="f-administrative" /> Administrative</label>
              <label class="form-check"><input type="checkbox" id="f-approver" /> Approver</label>
              <label class="form-check"><input type="checkbox" id="f-active" checked /> Active</label>
            </div>
          </div>
          <div class="form-group full" id="pwd-group">
            <label class="form-label">Password *</label>
            <input class="form-control" id="f-password" type="password" placeholder="Enter password" />
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-save">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4zm-5 16a3 3 0 110-6 3 3 0 010 6zm3-10H5V5h10v4z"/></svg>
          Save User
        </button>
      </div>
    </div>
  </div>

  <!-- DO NOT remove these two divs — layout.js requires them -->
  <div id="layout-root"></div>

  <div id="page-body">
    <!-- ============================================
         YOUR PAGE CONTENT GOES HERE ONLY.
         No sidebar, no header, no app-shell wrapper.
         layout.js handles all of that automatically.
         ============================================ -->

    <div class="dash-page-header">
      <div>
        <h1 class="dash-page-title">User Management</h1>
        <p class="dash-page-sub">Manage system users and permissions.</p>
      </div>
    </div>

  <!-- Main Card -->
  <div class="card">
    <div class="card__head">
      <span>List of Users</span>
      <div class="card__head-actions">
        <button class="card__minimize" title="Minimize">−</button>
      </div>
    </div>
    <div class="card__body">
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="btn btn-primary" id="btn-add">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a1 1 0 011 1v6h6a1 1 0 110 2h-6v6a1 1 0 11-2 0v-6H5a1 1 0 110-2h6V5a1 1 0 011-1z"/></svg>
            Add User
          </button>
          <button class="btn btn-success" id="btn-export">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zM9 17l-3-3h2v-4h2v4h2l-3 3zm5-12V3.5L18.5 8H14z"/></svg>
            Export
          </button>
        </div>
        <div class="toolbar-right">
          <div class="search-wrap">
            <label class="search-label">Show</label>
            <select class="show-select" id="page-size">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div class="search-wrap">
            <label class="search-label">Search:</label>
            <input class="search-input" type="text" id="search-input" placeholder="Search users…" />
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table id="user-table">
          <colgroup>
            <col class="col-name">
            <col class="col-empno">
            <col class="col-email">
            <col class="col-role">
            <col class="col-bool">
            <col class="col-bool">
            <col class="col-bool">
            <col class="col-bool">
            <col class="col-action">
          </colgroup>
          <thead>
            <tr>
              <th class="sortable" data-col="name">NAME <span class="sort-icon"><svg viewBox="0 0 10 10"><path d="M5 1l4 4H1z" fill="currentColor"/></svg><svg viewBox="0 0 10 10"><path d="M5 9L1 5h8z" fill="currentColor"/></svg></span></th>
              <th class="sortable" data-col="empno">EMP # <span class="sort-icon"><svg viewBox="0 0 10 10"><path d="M5 1l4 4H1z" fill="currentColor"/></svg><svg viewBox="0 0 10 10"><path d="M5 9L1 5h8z" fill="currentColor"/></svg></span></th>
              <th class="sortable" data-col="email">EMAIL <span class="sort-icon"><svg viewBox="0 0 10 10"><path d="M5 1l4 4H1z" fill="currentColor"/></svg><svg viewBox="0 0 10 10"><path d="M5 9L1 5h8z" fill="currentColor"/></svg></span></th>
              <th>ROLE</th>
              <th class="td-center">CUSTODIAN</th>
              <th class="td-center">ADMIN</th>
              <th class="td-center">APPROVER</th>
              <th class="td-center">ACTIVE</th>
              <th class="td-center">ACTION</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <!-- Footer -->
      <div class="table-footer">
        <span id="showing-info">Showing 0 to 0 of 0 entries</span>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
    </div><!-- /#page-body -->
  <!-- Optional page-specific script -->
  <script src="user-management.js"></script>

</body>
</html>
